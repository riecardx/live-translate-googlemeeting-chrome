<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet Live Translate</title><link rel="stylesheet" href="panel.css"></head><body>
<header><div class="brand"><span class="mark">文</span><div><strong>Meet Translate</strong><small>LIVE CAPTION SIDEBAR</small></div></div><span id="status" class="status">等待会议</span></header>
<div class="toolbar"><span id="meeting" title="当前关联会议">未找到 Meet 标签页</span><button id="clear" title="清空记录">清空</button></div>
<main><section class="pane"><div class="pane-head"><div><span class="dot blue"></span>原始字幕</div><label>语言 <select id="source"><option value="auto">自动识别</option><option value="Chinese">中文</option><option value="Japanese">日本語</option><option value="English">English</option><option value="Korean">한국어</option></select></label></div><div class="lines" id="original"><p class="empty">请在 Google Meet 中开启字幕 (CC)<br>字幕会实时显示在这里</p></div></section>
<div class="divider"></div><section class="pane"><div class="pane-head"><div><span class="dot green"></span>实时翻译</div><label>目标 <select id="target"><option value="Chinese">中文</option><option value="Japanese">日本語</option><option value="English">English</option><option value="Korean">한국어</option></select></label></div><div class="lines" id="translated"><p class="empty">译文将自动跟随字幕更新<br>使用本机 Qwen MT 翻译服务</p></div></section></main>
<footer><span id="bridge">本机翻译服务检测中…</span><label><input type="checkbox" id="follow" checked>跟随最新</label></footer><script src="panel.js"></script></body></html>
